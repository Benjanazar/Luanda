<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock — Luanda Admin</title>
<style>
*{margin:0;box-sizing:border-box}
body{background:#0d0d0d;color:#f5f0e8;font-family:'Georgia',serif;min-height:100vh;padding:0}
header{background:#111;border-bottom:1px solid rgba(201,168,76,.2);padding:16px 24px;display:flex;align-items:center;gap:16px}
header img{height:36px;border-radius:2px}
header h1{font-size:18px;font-weight:400;color:#c9a84c;letter-spacing:.05em}
header .spacer{flex:1}
#logoutBtn{display:none;background:none;border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;cursor:pointer;border-radius:2px}
#logoutBtn:hover{background:rgba(201,168,76,.1)}

#loginWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px}
#loginWrap p{color:rgba(245,240,232,.5);font-size:14px}
#loginWrap input{background:#1a1a1a;border:1px solid rgba(201,168,76,.3);color:#f5f0e8;font-size:15px;padding:12px 16px;width:280px;border-radius:2px;outline:none}
#loginWrap input:focus{border-color:#c9a84c}
#loginBtn{background:#c9a84c;color:#0d0d0d;border:none;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 32px;cursor:pointer;border-radius:2px;width:280px}
#loginBtn:hover{background:#e0be6a}
#loginErr{color:#e05555;font-size:13px;display:none}

#adminWrap{display:none;padding:24px}
.search-bar{margin-bottom:20px}
.search-bar input{background:#1a1a1a;border:1px solid rgba(201,168,76,.2);color:#f5f0e8;font-size:14px;padding:10px 14px;width:100%;max-width:400px;border-radius:2px;outline:none}
.search-bar input:focus{border-color:#c9a84c}
.search-bar input::placeholder{color:rgba(245,240,232,.3)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;color:#c9a84c;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;border-bottom:1px solid rgba(201,168,76,.2)}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.prod-name{color:#f5f0e8}
.qty-cell{display:flex;align-items:center;gap:8px}
.qty-input{background:#1a1a1a;border:1px solid rgba(201,168,76,.25);color:#f5f0e8;font-size:14px;padding:6px 10px;width:72px;border-radius:2px;outline:none;text-align:center}
.qty-input:focus{border-color:#c9a84c}
.save-btn{background:none;border:1px solid rgba(201,168,76,.35);color:#c9a84c;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;cursor:pointer;border-radius:2px;white-space:nowrap}
.save-btn:hover{background:rgba(201,168,76,.1)}
.save-btn.saving{opacity:.5;pointer-events:none}
.save-btn.ok{border-color:#4caf50;color:#4caf50}
.save-btn.err{border-color:#e05555;color:#e05555}
.badge-zero{color:rgba(245,240,232,.25)}
.badge-low{color:#e09a4c}
.badge-ok{color:#4caf50}

#loading{padding:60px;text-align:center;color:rgba(245,240,232,.4)}
</style>
</head>
<body>
<header>
  <h1>Luanda · Gestión de Stock</h1>
  <div class="spacer"></div>
  <button id="logoutBtn" onclick="logout()">Cerrar sesión</button>
</header>

<div id="loginWrap">
  <p>Acceso restringido</p>
  <input type="password" id="passInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()">
  <button id="loginBtn" onclick="login()">Entrar</button>
  <span id="loginErr">Contraseña incorrecta</span>
</div>

<div id="adminWrap">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Buscar producto..." oninput="filterTable()">
  </div>
  <div id="loading">Cargando stock...</div>
  <table id="stockTable" style="display:none">
    <thead><tr>
      <th>Producto</th>
      <th>Stock actual</th>
      <th>Nuevo stock</th>
      <th></th>
    </tr></thead>
    <tbody id="stockBody"></tbody>
  </table>
</div>

<script>
let password = '';
let allProducts = [];

function login() {
  const val = document.getElementById('passInput').value.trim();
  if (!val) return;
  password = val;
  document.getElementById('loginErr').style.display = 'none';
  loadStock();
}

function logout() {
  password = '';
  allProducts = [];
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminWrap').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('passInput').value = '';
  document.getElementById('stockTable').style.display = 'none';
  document.getElementById('loading').textContent = 'Cargando stock...';
  document.getElementById('stockBody').innerHTML = '';
}

async function loadStock() {
  try {
    const r = await fetch('/api/stock-admin', {
      headers: { 'X-Admin-Password': password }
    });
    if (r.status === 403) {
      document.getElementById('loginErr').style.display = 'block';
      password = '';
      return;
    }
    const products = await r.json();
    allProducts = products;

    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'block';
    renderTable(products);
  } catch(e) {
    alert('Error al conectar. Intentá de nuevo.');
  }
}

function renderTable(products) {
  const tbody = document.getElementById('stockBody');
  tbody.innerHTML = '';
  products.forEach(({ name, qty }) => {
    const badgeClass = qty === 0 ? 'badge-zero' : qty <= 2 ? 'badge-low' : 'badge-ok';
    const tr = document.createElement('tr');
    tr.dataset.name = name.toLowerCase();
    tr.innerHTML = `
      <td class="prod-name">${esc(name)}</td>
      <td class="${badgeClass}">${qty}</td>
      <td class="qty-cell">
        <input class="qty-input" type="number" min="0" value="${qty}" data-name="${esc(name)}">
      </td>
      <td><button class="save-btn" onclick="saveRow(this)">Guardar</button></td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('loading').style.display = 'none';
  document.getElementById('stockTable').style.display = 'table';
}

function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('#stockBody tr').forEach(tr => {
    tr.style.display = tr.dataset.name.includes(q) ? '' : 'none';
  });
}

async function saveRow(btn) {
  const row = btn.closest('tr');
  const input = row.querySelector('.qty-input');
  const name = input.dataset.name;
  const qty = parseInt(input.value);
  if (isNaN(qty) || qty < 0) return;

  btn.classList.add('saving');
  btn.textContent = '...';

  try {
    const r = await fetch('/api/stock-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      body: JSON.stringify({ name, qty })
    });
    const d = await r.json();
    if (d.ok) {
      btn.textContent = '✓ Guardado';
      btn.classList.remove('saving');
      btn.classList.add('ok');
      // Actualizar celda de stock actual
      const cells = row.querySelectorAll('td');
      cells[1].textContent = qty;
      cells[1].className = qty === 0 ? 'badge-zero' : qty <= 2 ? 'badge-low' : 'badge-ok';
      setTimeout(() => { btn.textContent = 'Guardar'; btn.classList.remove('ok'); }, 2000);
    } else {
      throw new Error(d.error || 'error');
    }
  } catch(e) {
    btn.textContent = 'Error';
    btn.classList.remove('saving');
    btn.classList.add('err');
    setTimeout(() => { btn.textContent = 'Guardar'; btn.classList.remove('err'); }, 2500);
  }
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
</script>
</body>
</html>
